server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: claim-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        retry.backoff.ms: 300
        linger.ms: 5
        compression.type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthonetpa}
    username: ${SPRING_DATASOURCE_USERNAME:healthonetpa}
    password: ${SPRING_DATASOURCE_PASSWORD:healthonetpa2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  kafka:
    claim-topic: ${KAFKA_CLAIM_TOPIC:claim-events}
    audit-topic: ${KAFKA_AUDIT_TOPIC:audit-log}
  service-instance: ${SERVICE_INSTANCE:claim-service-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: HealthOne TPA Claim Service API
    description: REST API for submitting and tracking insurance claims
    version: 1.0.0

logging:
  level:
    com.healthonetpa: ${LOG_LEVEL:INFO}

# ──────────────────────────────────────────────────────────────────────────────
#  HealthOne TPA · Claim Service CI Pipeline
#  Runs on every push to any branch; merge to main requires both stages green.
# ──────────────────────────────────────────────────────────────────────────────

image: python:3.12-slim

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

before_script:
  - pip install --quiet -r requirements.txt

# ── Stage 1: Lint ──────────────────────────────────────────────────────────────
flake8:
  stage: lint
  script:
    - flake8 app/ tests/ --max-line-length=100 --extend-ignore=E203,W503
  allow_failure: false

# ── Stage 2: Unit Tests ────────────────────────────────────────────────────────
pytest:
  stage: test
  script:
    - pytest tests/ -v --tb=short --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 7 days
  coverage: '/TOTAL.*\s+(\d+%)$/'
